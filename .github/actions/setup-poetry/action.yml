name: Set up Python and Poetry environment
description: >-
  Install Python, Poetry and the locked project dependencies into .venv,
  restoring the virtual environment from the cache when the lock file,
  Python version and install arguments match.

inputs:
  python-version:
    description: Python version to set up.
    required: true
  install-args:
    description: Extra arguments for poetry sync, e.g. "--extras kerberos".
    default: ""

runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      shell: bash
      run: pip install poetry==2.2.0

    # Cache keys cannot contain commas, which group lists such as
    # "--only main,dev" do, so the install arguments enter the key as a hash.
    - id: key
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        args_hash=$(printf '%s' "$INSTALL_ARGS" | sha256sum | cut -c1-12)
        echo "value=venv-${RUNNER_OS}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}-${args_hash}" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: ${{ steps.key.outputs.value }}

    # sync, not install: it also removes packages a restored environment
    # holds beyond the lock, so the cache never changes what runs.
    - name: Install locked dependencies
      shell: bash
      env:
        POETRY_VIRTUALENVS_IN_PROJECT: "true"
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: poetry sync $INSTALL_ARGS

    # Saved before any later job step can change the environment.
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .venv
        key: ${{ steps.key.outputs.value }}
