name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.select.outputs.unit }}
      integration: ${{ steps.select.outputs.integration }}
      lint: ${{ steps.select.outputs.lint }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select checks from the complete change
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --no-renames --name-only -z "$PR_BASE...$PR_HEAD" > changed-files
          elif [[ "$EVENT_NAME" == push && "$EVENT_REF" == refs/heads/main && "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            git diff --no-renames --name-only -z "$PUSH_BASE" "$PUSH_HEAD" > changed-files
          else
            printf 'unit=true\nintegration=true\nlint=true\ndocs=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/scripts/select-checks.sh < changed-files >> "$GITHUB_OUTPUT"

  unit:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    uses: ./.github/workflows/unit-test.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
      pages: write
      id-token: write

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    uses: ./.github/workflows/lint.yml

  coverage-comment:
    needs: [changes, unit]
    if: github.event_name == 'pull_request' && needs.changes.outputs.unit == 'true'
    uses: ./.github/workflows/coverage-comment.yml
    permissions:
      contents: read
      pull-requests: write

  coverage-badge:
    needs: [changes, unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.unit == 'true'
    uses: ./.github/workflows/coverage-badge.yml
    permissions:
      contents: write
      pull-requests: write

  integration:
    needs: [changes, unit]
    # An integration-only change does not need to run unit tests.
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.integration == 'true' &&
      (needs.unit.result == 'success' || needs.unit.result == 'skipped') }}
    uses: ./.github/workflows/integration-test.yml
