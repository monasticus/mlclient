name: Test MLClient (INTEGRATION)

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: integration-tests (${{ matrix.marklogic-image }})
    strategy:
      fail-fast: false
      matrix:
        marklogic-image:
          - progressofficial/marklogic-db:10.0-11.1-ubi-2.2.4
          - progressofficial/marklogic-db:11.3.7-ubi-2.3.0
          - progressofficial/marklogic-db:12.1.0-ubi-2.3.0

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Kerberos client libraries
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev krb5-user

      - name: Install MLClient with poetry
        run: |
          pip install poetry==2.2.0
          poetry install --extras kerberos

      - name: Start MarkLogic and provision the connection matrix
        env:
          MARKLOGIC_IMAGE: ${{ matrix.marklogic-image }}
        run: docker compose -f tests/integration/docker-compose.yaml up -d --build

      - name: Wait for provisioning to complete
        run: |
          for _ in $(seq 1 120); do
            health=$(docker inspect --format '{{.State.Health.Status}}' mlclient_integration)
            state=$(docker inspect --format '{{.State.Status}}' mlclient_integration)
            echo "MarkLogic state: ${state}, health: ${health}"
            [ "${health}" = "healthy" ] && exit 0
            if [ "${state}" = "exited" ] || [ "${state}" = "dead" ] || [ "${health}" = "unhealthy" ]; then
              echo "MarkLogic failed before becoming healthy" >&2
              docker logs mlclient_integration
              exit 1
            fi
            sleep 10
          done
          echo "MarkLogic did not become healthy in time" >&2
          docker logs mlclient_integration
          exit 1

      - name: Test code with pytest
        env:
          MLCLIENT_IT_CERTS_DIR: tests/integration/.certs
          MLCLIENT_IT_FAIL_ON_MISSING_PREREQUISITES: "1"
        run: poetry run pytest -ra tests/integration/

      - name: Dump integration service logs on failure
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yaml logs --no-color
