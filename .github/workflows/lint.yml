name: Lint MLClient

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MLClient with poetry
        uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.14"

      - name: Lint with Ruff
        run: poetry run ruff check --output-format=github .

  typing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/setup-poetry
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check the package
        run: poetry run mypy
      - name: Build and install the typed wheel
        run: |
          poetry build --format wheel
          poetry run pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed consumer contracts
        run: poetry run python scripts/check_typing.py
