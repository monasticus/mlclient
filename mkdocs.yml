strict: true
exclude_docs: |
  gen_ref_pages.py
  griffe_extensions.py
site_name: MLClient
site_description: A Python client for MarkLogic Server — three API layers, async, CLI included.
site_url: https://monasticus.github.io/mlclient/
repo_url: https://github.com/monasticus/mlclient
repo_name: monasticus/mlclient
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table
            filters: ["!^_"]
            extensions:
              - docs/griffe_extensions.py:LegacyDocstrings
              - griffe_pydantic:
                  schema: true

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Python Guide:
      - Overview: user/pythonapi.md
      - Documents: user/python/documents.md
      - Evaluate code: user/python/eval.md
      - Transactions: user/python/transactions.md
      - Read logs: user/python/logs.md
      - Health and administration: user/python/operations.md
      - Connection and authentication: user/python/connections.md
      - Environments and runtime settings: user/setup.md
      - API layers: user/python/api-layers.md
      - Custom application APIs: user/python/custom-api.md
      - Recipes: recipes.md
  - CLI:
      - Overview: user/cli.md
      - Environment: user/cli/env.md
      - Initialize environment: user/cli/env/init.md
      - Show environment: user/cli/env/show.md
      - Eval: user/cli/eval.md
      - HTTP: user/cli/http.md
      - Logs: user/cli/logs.md
      - Log level: user/cli/log-level.md
      - Health: user/cli/health.md
      - Version: user/cli/version.md
  - API Reference: reference/
  - Project:
      - Background: about.md
      - AI agents: agents.md
      - Stability: stability.md
      - Releases: releasing.md
  - Contributing:
      - Contribution guide: contributing.md
      - Documentation: documentation.md

extra:
  version:
    provider: mike
    alias: true
    default: latest

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
