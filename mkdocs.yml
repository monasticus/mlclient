strict: true
exclude_docs: |
  gen_ref_pages.py
  griffe_extensions.py
site_name: MLClient
site_description: A Python client for MarkLogic Server — three API layers, async, CLI included.
site_url: https://monasticus.github.io/mlclient/
repo_url: https://github.com/monasticus/mlclient
repo_name: monasticus/mlclient
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table
            filters: ["!^_"]
            extensions:
              - docs/griffe_extensions.py:LegacyDocstrings
              - griffe_pydantic:
                  schema: true

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Introduction: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Clients: user/clients.md
      - Environments: user/environments.md
      - Documents: user/python/documents.md
      - Evaluate code: user/python/eval.md
      - Transactions: user/python/transactions.md
      - Async support: user/python/async.md
      - Health and administration: user/python/health-and-administration.md
      - Recipes: recipes.md
  - Advanced:
      - Services: user/python/services.md
      - More on environments: user/python/more-on-environments.md
      - Connections and authentication: user/python/connections.md
      - HTTP configuration:
          - Overview: user/http-configuration.md
          - Timeouts: user/python/timeouts.md
          - Retries: user/python/retries.md
          - Resource limits: user/python/limits.md
      - Custom application APIs: user/python/custom-api.md
  - CLI:
      - Overview: user/cli.md
      - env:
          - Overview: user/cli/env.md
          - init: user/cli/env/init.md
          - show: user/cli/env/show.md
          - edit: user/cli/env/edit.md
          - copy: user/cli/env/copy.md
      - eval: user/cli/eval.md
      - http: user/cli/http.md
      - logs: user/cli/logs.md
      - log-level: user/cli/log-level.md
      - trace-events: user/cli/trace-events.md
      - health: user/cli/health.md
      - version: user/cli/version.md
  - API reference: reference/
  - Community:
      - Background: about.md
      - Built with: built-with.md
      - Stability: stability.md
      - Contributing: contributing.md
      - Writing documentation: documentation.md
      - Release process: releasing.md

extra:
  version:
    provider: mike
    alias: true
    default: latest

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
