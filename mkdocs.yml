strict: true
exclude_docs: |
  gen_ref_pages.py
  griffe_extensions.py
site_name: MLClient
site_description: A Python client for MarkLogic Server — three API layers, async, CLI included.
site_url: https://monasticus.github.io/mlclient/
repo_url: https://github.com/monasticus/mlclient
repo_name: monasticus/mlclient
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table
            filters: ["!^_"]
            extensions:
              - docs/griffe_extensions.py:LegacyDocstrings
              - griffe_pydantic:
                  schema: true

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Introduction: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Clients: guides/clients.md
      - Documents: guides/documents.md
      - Evaluate code: guides/eval.md
      - Search: guides/search.md
      - Transactions: guides/transactions.md
      - Environments: guides/environments.md
      - Async support: guides/async.md
      - Logging to MarkLogic: guides/logging.md
  - Advanced:
      - Services: advanced/services.md
      - XQuery API: advanced/xquery-api.md
      - Structured and CTS queries: advanced/queries.md
      - More on environments: advanced/more-on-environments.md
      - Connections and authentication: advanced/connections.md
      - HTTP configuration:
          - Overview: advanced/http/index.md
          - Timeouts: advanced/http/timeouts.md
          - Retries: advanced/http/retries.md
          - Resource limits: advanced/http/limits.md
      - Health and administration: advanced/health-and-administration.md
      - Custom application APIs: advanced/custom-api.md
  - CLI:
      - Overview: cli/index.md
      - env:
          - Overview: cli/env/index.md
          - init: cli/env/init.md
          - show: cli/env/show.md
          - edit: cli/env/edit.md
          - copy: cli/env/copy.md
          - remove: cli/env/remove.md
          - compare: cli/env/compare.md
      - eval: cli/eval.md
      - http: cli/http.md
      - sample: cli/sample.md
      - logs: cli/logs.md
      - log-level: cli/log-level.md
      - trace-events: cli/trace-events.md
      - health: cli/health.md
      - version: cli/version.md
      - url: cli/url.md
  - Recipes: recipes.md
  - API reference: reference/
  - Community:
      - Background: community/about.md
      - Built with: community/built-with.md
      - Stability: community/stability.md
      - Contributing: community/contributing.md
      - Writing documentation: community/documentation.md
      - Release process: community/releasing.md

extra:
  version:
    provider: mike
    alias: true
    default: latest

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
