[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "mlclient"
version = "0.4.1"
description = "A Python client and CLI for MarkLogic Server with sync and async APIs"
authors = [{name = "Tomasz Aniołowski", email = "tomasz.maciej.aniolowski@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
readme = "README.md"
keywords = ["MarkLogic", "marklogic", "database", "client", "data", "xml", "json", "NoSQL", "nosql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27.0,<0.28.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "pydantic>=2.8.2,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "cleo>=2.1.0,<3.0.0",
    "xmltodict>=0.13.0,<0.14.0",
    "aiofiles>=24.1.0,<25.0.0",
    "httpx-retries>=0.4.5,<0.5.0",
]

[project.optional-dependencies]
kerberos = ["pyspnego[kerberos]>=0.12.1,<0.13.0"]

[project.urls]
Repository = "https://github.com/monasticus/mlclient"
Documentation = "https://monasticus.github.io/mlclient/"
Issues = "https://github.com/monasticus/mlclient/issues"
Changelog = "https://github.com/monasticus/mlclient/releases"

[project.scripts]
ml = "mlclient.cli:main"

[tool.poetry]
packages = [{include = "mlclient"}]
include = ["mlclient/resources/*"]

[tool.poetry.group.dev.dependencies]
ruff = "*"
isort = "^5.13.2"
pytest = "^9.0.3"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
pytest-benchmark = {extras = ["histogram"], version = "^5.1.0"}
pytest-asyncio = "^1.0.0"
respx = "^0.21.1"
requests = "^2.33.0"
responses = "^0.23.3"
deepdiff = "^8.6.2"
pyjwt = "^2.13.0"
cryptography = "^50.0.0"
packaging = ">=24,<27"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = { extras = ["python"], version = ">=0.26,<1.0" }
mkdocs-gen-files = "^0.5"
mkdocs-literate-nav = "0.6.2"
mkdocs-section-index = "0.3.9"
griffe-pydantic = "^1.0"
mike = "^2.1"
ruff = "*"  # Signature formatting must match local and CI builds.

[tool.poetry.requires-plugins]
poetry-bumpversion = "==0.3.3"

[tool.poetry_bumpversion.file."mlclient/__init__.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--strict-markers", "--benchmark-autosave"]
markers = [
    "ml_access" # marks tests requiring an ML access
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run:
    "raise NotImplementedError$",
    # Type-checking imports are never executed at runtime:
    "if TYPE_CHECKING:",
]

[tool.isort]
skip_glob=[
    # Disable imports' sorting when the import order is important
    "mlclient/calls/__init__.py",
    "mlclient/clients/__init__.py"
]

[tool.ruff]
lint.select = [
    "F", "E", "W", "C90", "N", "D", "UP", "B", "A", "COM", "C4", "EM", "EXE", "ISC", "G", "PIE", "T20",
    "PT", "Q", "RSE", "RET", "SLF", "SIM", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "RUF", "FLY",
    "ASYNC", "FA", "FIX", "PERF", "FURB", "LOG"
#    , "CPY"
]
lint.ignore = []
exclude = [
    ".git",
    ".github",
    ".idea",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".benchmarks",
    "__pycache__",
    "dist",
    "venv",
    "meta",
    "docs",
    "scripts"
]
target-version = "py39"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"mlclient/ml_profile.py" = [
    "PLR6301" # allow for a non-static method as it is defined by the Pydantic lib
]
"mlclient/calls/*" = [
    "PLR0913" # allow many arguments as they depend on ML REST resource
]
"mlclient/cli/commands/*" = [
    "RUF012"  # allow for missing ClassVar annotations as superclass does not use them
]
"mlclient/cli/app.py" = [
    "A002",  # allow for shadowing input builtin as it is superclass method definition
    "PLR6301"  # allow for a non-static method as it is defined in a superclass
]
"mlclient/api/*" = [
    "PLR0913" # allow many arguments as they depend on ML REST resource
]
"mlclient/clients/*" = [
    "PLR0913", # allow many arguments as they depend on ML REST resource
]
"mlclient/services/*" = [
    "PLR0913" # allow many arguments as they mirror ML REST resource params
]
"mlclient/models/*" = [
    "UP006", # pydantic evaluates field annotations at runtime; list[] needs 3.10+
    "UP007", # pydantic evaluates field annotations at runtime; X | Y needs 3.10+
    "UP045", # pydantic evaluates field annotations at runtime; Optional needs 3.10+
]
"mlclient/connection.py" = [
    "UP007", # pydantic evaluates field annotations at runtime; X | Y needs 3.10+
    "UP045", # pydantic evaluates field annotations at runtime; Optional needs 3.10+
]
"mlclient/auth.py" = [
    "UP045", # pydantic evaluates field annotations at runtime; Optional needs 3.10+
    "PLR0913", # build_auth mirrors the connection params it resolves
]
"mlclient/http_config.py" = [
    "PLR0913", # HTTPConfig mirrors the connection params it resolves
]
"mlclient/ml_environment.py" = [
    "UP007", # pydantic evaluates field annotations at runtime; X | Y needs 3.10+
    "UP045", # pydantic evaluates field annotations at runtime; Optional needs 3.10+
]
"mlclient/models/documents.py" = [
    "PLR0913" # allow many arguments as they depend on ML structure
]
"tests/*" = [
    "C901", # allow complex test helpers
    "D", # disable pydocstyle for tests
    "EM101", # allow string literals in exceptions' tests
    "PLC1901", # allow comparison to blank string in tests
    "PLR0915", # allow many statements in tests
    "PLR2004", # allow magic values in tests
    "SLF001", # allow private members access in tests
]
"tests/unit/mlclient/calls/test_eval_call.py" = [
    "W291" # allow trailing whitespace in multiline string for testing purpose
]
"tests/unit/mlclient/clients/test_ml_client.py" = [
    "ERA001" # allow commented-out code to await for pytest bug fix
]
"tests/utils/__init__.py" = [
    "T201" # allow printing by MLResponseBuilder
]
"tests/integration/provision/provision.py" = [
    "T201", # provisioning is a CLI script - progress goes to stdout
    "PERF203" # retry loop must catch transport errors per attempt
]
"tests/utils/ml_mockers.py" = [
    "T201", # allow printing by MLMocker
]
